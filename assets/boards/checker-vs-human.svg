<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#FFFFFF"/><g font-family="PingFang SC, Source Han Sans SC, Arial, sans-serif"><text x="90" y="80" fill="#111111" font-size="34" font-weight="600">校验器抓机械问题，人管判断题</text><text x="90" y="116" fill="#666666" font-size="17">通用启发式不维护姓名黑名单——名单会漏、会过期，本身也是敏感物</text><line x1="90" y1="150" x2="1110" y2="150" stroke="#E8E8E8" stroke-width="1"/><rect x="120" y="220" width="430" height="360" rx="4" fill="#EAF0FF" stroke="#2F6BFF" stroke-width="1.5"/><text x="150" y="270" fill="#111111" font-size="22" font-weight="600">校验器（自动）</text><text x="150" y="315" fill="#444444" font-size="15">缺 LICENSE</text><text x="150" y="350" fill="#444444" font-size="15">密钥 / token 模式</text><text x="150" y="385" fill="#444444" font-size="15">内部 ID 格式（ou_/cli_/邮箱域）</text><text x="150" y="420" fill="#444444" font-size="15">硬编码 home 路径</text><text x="150" y="455" fill="#444444" font-size="15">frontmatter 是否合法</text><text x="150" y="505" fill="#2F6BFF" font-size="14">可判定 → 早期预警</text><rect x="650" y="220" width="430" height="360" rx="4" fill="#F5F5F5" stroke="#B8B8B8" stroke-width="1"/><text x="680" y="270" fill="#111111" font-size="22" font-weight="600">人工复核（判断）</text><text x="680" y="315" fill="#444444" font-size="15">真实同事 / 客户姓名</text><text x="680" y="350" fill="#444444" font-size="15">内部工具 / 方法论代号</text><text x="680" y="385" fill="#444444" font-size="15">真实业务数据</text><text x="680" y="420" fill="#444444" font-size="15">description 是否真能触发</text><text x="680" y="455" fill="#444444" font-size="15">LICENSE 类型是否合适</text><text x="680" y="505" fill="#888888" font-size="14">需要语境 → 靠人兜底</text><circle cx="600" cy="400" r="7" fill="#2F6BFF"/><text x="600" y="620" text-anchor="middle" fill="#999999" font-size="14">早期预警不是终审</text></g></svg>
