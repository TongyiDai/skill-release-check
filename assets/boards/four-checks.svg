<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#FFFFFF"/><g font-family="PingFang SC, Source Han Sans SC, Arial, sans-serif"><text x="90" y="80" fill="#111111" font-size="34" font-weight="600">四类检查，ERROR 阻断发布</text><text x="90" y="116" fill="#666666" font-size="17">WARNING 应改不阻断；发布的是 git 内容，用 --tracked-only 只看将推送的文件</text><line x1="90" y1="150" x2="1110" y2="150" stroke="#E8E8E8" stroke-width="1"/><rect x="90" y="210" width="245" height="380" rx="4" fill="#F7F7F7" stroke="#B8B8B8" stroke-width="1"/><rect x="90" y="210" width="245" height="52" rx="4" fill="#EAF0FF" stroke="#2F6BFF" stroke-width="1.2"/><text x="212" y="243" text-anchor="middle" fill="#111111" font-size="19" font-weight="600">A 结构与触发</text><text x="112" y="300" fill="#444444" font-size="14">SKILL.md 存在</text><text x="112" y="330" fill="#444444" font-size="14">name 合规、配目录</text><text x="112" y="360" fill="#444444" font-size="14">description 含触发词</text><text x="112" y="390" fill="#444444" font-size="14">第三人称</text><text x="112" y="420" fill="#444444" font-size="14">正文 ≤500 行</text><rect x="368" y="210" width="245" height="380" rx="4" fill="#F7F7F7" stroke="#B8B8B8" stroke-width="1"/><rect x="368" y="210" width="245" height="52" rx="4" fill="#EAF0FF" stroke="#2F6BFF" stroke-width="1.2"/><text x="490" y="243" text-anchor="middle" fill="#111111" font-size="19" font-weight="600">B 可移植性</text><text x="390" y="300" fill="#444444" font-size="14">无硬编码 home 路径</text><text x="390" y="330" fill="#444444" font-size="14">无 Windows 反斜杠</text><text x="390" y="360" fill="#444444" font-size="14">引用一层深</text><text x="390" y="405" fill="#999999" font-size="13">跨 32+ agent 零改动</text><rect x="646" y="210" width="245" height="380" rx="4" fill="#F7F7F7" stroke="#B8B8B8" stroke-width="1"/><rect x="646" y="210" width="245" height="52" rx="4" fill="#EAF0FF" stroke="#2F6BFF" stroke-width="1.2"/><text x="768" y="243" text-anchor="middle" fill="#111111" font-size="19" font-weight="600">C 健壮性</text><text x="668" y="300" fill="#444444" font-size="14">无时效性措辞</text><text x="668" y="345" fill="#999999" font-size="13">依赖声明、错误自愈</text><text x="668" y="372" fill="#999999" font-size="13">（评审关注）</text><rect x="924" y="210" width="186" height="380" rx="4" fill="#EAF0FF" stroke="#2F6BFF" stroke-width="1.5"/><rect x="924" y="210" width="186" height="52" rx="4" fill="#2F6BFF"/><text x="1017" y="243" text-anchor="middle" fill="#FFFFFF" font-size="19" font-weight="600">D 隐私合规</text><text x="946" y="300" fill="#111111" font-size="14" font-weight="600">无密钥</text><text x="946" y="335" fill="#111111" font-size="14" font-weight="600">无内部 ID</text><text x="946" y="370" fill="#111111" font-size="14" font-weight="600">有 LICENSE</text><text x="946" y="420" fill="#2F6BFF" font-size="13">最高优先级</text><text x="600" y="640" text-anchor="middle" fill="#999999" font-size="14">机械可判定归校验器，真实姓名/内部术语归人工复核</text></g></svg>
